{% extends "base.html" %}{% block title %}Log in · Life RPG{% endblock %}
{% block content %}<section class="auth-layout"><div class="auth-panel"><div class="eyebrow">RETURNING HERO</div><h1>Resume your run.</h1><p>Sign in to pick up exactly where you left off.</p><form method="post" class="form-card"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="primary-btn large" type="submit">Enter the command deck</button></form><p class="auth-foot">New player? <a href="{{ url_for('signup') }}">Create an account</a></p></div><div class="auth-art"><div class="art-ring"></div><div class="art-core">✦</div><p>YOUR PROGRESS<br><strong>STAYS YOURS.</strong></p></div></section>{% endblock %}
