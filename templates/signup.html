{% extends "base.html" %}{% block title %}Create character · Life RPG{% endblock %}
{% block content %}<section class="auth-layout"><div class="auth-panel"><div class="eyebrow">NEW CHARACTER</div><h1>Start the run.</h1><p>Build a character around the person you want to become.</p><form method="post" class="form-card"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Name<input type="text" name="name" minlength="2" maxlength="80" required autocomplete="name"></label><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" minlength="8" required autocomplete="new-password"><small>Use at least 8 characters.</small></label><button class="primary-btn large" type="submit">Create character <span>→</span></button></form><p class="auth-foot">Already playing? <a href="{{ url_for('login') }}">Log in</a></p></div><div class="auth-art stats-art"><div class="art-stat"><strong>+120</strong><span>XP</span></div><div class="art-stat"><strong>+45</strong><span>GOLD</span></div><div class="art-stat"><strong>+1</strong><span>STREAK</span></div></div></section>{% endblock %}
