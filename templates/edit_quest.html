{% extends "base.html" %}{% block title %}Edit quest · Life RPG{% endblock %}
{% block content %}<section class="wrap narrow"><div class="page-head"><div><div class="eyebrow">QUEST EDITOR</div><h1>Refine the mission.</h1><p>Completed quests stay locked so your history remains trustworthy.</p></div></div><div class="panel"><form method="post" class="quest-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Title<input name="title" value="{{ quest.title }}" maxlength="140" required></label><label>Description<textarea name="description" maxlength="500" rows="4">{{ quest.description }}</textarea></label><div class="form-grid"><label>Category<select name="category">{% for key,(name,icon,_) in category_map.items() %}<option value="{{ key }}" {% if quest.category==key %}selected{% endif %}>{{ icon }} {{ name }}</option>{% endfor %}</select></label><label>Difficulty<select name="difficulty">{% for key,r in difficulty_rewards.items() %}<option value="{{ key }}" {% if quest.difficulty==key %}selected{% endif %}>{{ key|capitalize }} · +{{ r.xp }} XP · ◈ {{ r.gold }}</option>{% endfor %}</select></label></div><div class="button-row"><a class="ghost-btn" href="{{ url_for('quests') }}">Cancel</a><button class="primary-btn" type="submit">Save changes</button></div></form></div></section>{% endblock %}
